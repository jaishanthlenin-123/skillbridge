version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: skillbridge-db
    environment:
      POSTGRES_DB: skillbridge_db
      POSTGRES_USER: skillbridge_user
      POSTGRES_PASSWORD: skillbridge_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U skillbridge_user -d skillbridge_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  ml_service:
    build:
      context: ..
      dockerfile: infrastructure/Dockerfile.ml
    container_name: skillbridge-ml
    ports:
      - "8001:8001"
    environment:
      - ML_SERVICE_INTERNAL_TOKEN=skillbridge-internal-secret-token-change-in-production
      - EMBEDDING_MODEL_NAME=all-MiniLM-L6-v2
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8001/internal/v1/health/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3

  backend:
    build:
      context: ..
      dockerfile: infrastructure/Dockerfile.backend
    container_name: skillbridge-backend
    command: >
      sh -c "python manage.py migrate &&
             python manage.py runserver 0.0.0.0:8000"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      ml_service:
        condition: service_healthy
    environment:
      - ENVIRONMENT=development
      - DEBUG=True
      - DJANGO_SECRET_KEY=skillbridge-docker-dev-secret-key-12345
      - DB_ENGINE=django.db.backends.postgresql
      - DB_NAME=skillbridge_db
      - DB_USER=skillbridge_user
      - DB_PASSWORD=skillbridge_password
      - DB_HOST=db
      - DB_PORT=5432
      - ML_SERVICE_URL=http://ml_service:8001
      - ML_SERVICE_INTERNAL_TOKEN=skillbridge-internal-secret-token-change-in-production
    volumes:
      - private_storage_data:/app/backend/private_storage

volumes:
  postgres_data:
  private_storage_data:
