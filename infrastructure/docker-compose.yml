version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: skillbridge-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-skillbridge}
      POSTGRES_USER: ${POSTGRES_USER:-skillbridge_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-skillbridge_password}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-skillbridge_user} -d ${POSTGRES_DB:-skillbridge}"]
      interval: 5s
      timeout: 5s
      retries: 5

  ml_service:
    build:
      context: ..
      dockerfile: infrastructure/Dockerfile.ml
    container_name: skillbridge-ml
    restart: unless-stopped
    ports:
      - "127.0.0.1:8001:8001"
    environment:
      - ML_SERVICE_INTERNAL_TOKEN=${ML_SERVICE_INTERNAL_TOKEN:-skillbridge-internal-secret-token-change-in-production}
      - EMBEDDING_MODEL_NAME=all-MiniLM-L6-v2
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8001/internal/v1/health/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3

  backend:
    build:
      context: ..
      dockerfile: infrastructure/Dockerfile.backend
    container_name: skillbridge-backend
    restart: unless-stopped
    command: >
      sh -c "python manage.py migrate &&
             python manage.py seed_skillbridge &&
             python manage.py runserver 0.0.0.0:8000"
    ports:
      - "127.0.0.1:8080:8000"
    depends_on:
      db:
        condition: service_healthy
      ml_service:
        condition: service_healthy
    environment:
      - ENVIRONMENT=development
      - DEBUG=True
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY:-skillbridge-docker-dev-secret-key-12345}
      - DB_ENGINE=django.db.backends.postgresql
      - POSTGRES_DB=${POSTGRES_DB:-skillbridge}
      - POSTGRES_USER=${POSTGRES_USER:-skillbridge_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-skillbridge_password}
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - ML_SERVICE_URL=http://ml_service:8001
      - ML_SERVICE_INTERNAL_TOKEN=${ML_SERVICE_INTERNAL_TOKEN:-skillbridge-internal-secret-token-change-in-production}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-1.5-flash}
      - MONGODB_URI=${MONGODB_URI:-}
      - MONGODB_DATABASE=${MONGODB_DATABASE:-skillbridge}
      - GITHUB_API_TOKEN=${GITHUB_API_TOKEN:-}
    volumes:
      - private_storage_data:/app/backend/private_storage

volumes:
  postgres_data:
  private_storage_data:
